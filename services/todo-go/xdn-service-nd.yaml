---
name: todo_nd
image: sriwisma/todo_golang_nd_fixed
state: /app/data/
port: 80
consistency: linearizable
deterministic: false

requests:
  - path_prefix: "/"
    methods: "GET,OPTIONS,HEAD"
    behavior: read_only
  - path_prefix: "/"
    methods: "PUT,POST,DELETE"
    behavior: write_only
