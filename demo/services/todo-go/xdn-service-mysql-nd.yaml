---
name: todo_nd_mysql
components:
  - database:
      image: mysql:8
      environments:
        - MYSQL_ROOT_PASSWORD: root
        - MYSQL_DATABASE: tasks
  - frontend:
      image: sriwisma/todo_golang_nd_fixed
      port: 80
      environments:
        - DB_TYPE: mysql
        - DB_HOST: database
state: database:/var/lib/mysql/
consistency: linearizable
deterministic: false

requests:
  - path_prefix: "/"
    methods: "GET,OPTIONS,HEAD"
    behavior: read_only
  - path_prefix: "/"
    methods: "PUT,POST,DELETE"
    behavior: write_only
